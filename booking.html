<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Tickets — EventHub</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="index.html" class="brand">Event<span>Hub</span></a>
    <button class="nav-toggle" aria-label="Toggle menu">☰</button>
    <ul class="nav-links">
      <li><a href="index.html">Events</a></li>
      <li><a href="my-bookings.html">My Bookings</a></li>
      <li><a href="admin.html">Admin</a></li>
    </ul>
    <div class="nav-actions">
      <button class="theme-toggle" aria-label="Toggle dark mode">☾</button>
    </div>
  </div>
</nav>

<main class="section">
  <div class="container">
    <div id="bookingEventInfo"></div>

    <div id="countdownBar" class="countdown-bar">
      Booking expires in: <span id="countdownTimer">10:00</span>
    </div>

    <div class="booking-layout">
      <!-- Seat selection -->
      <div class="seat-panel">
        <h3>Select Your Seats</h3>
        <div class="seat-legend">
          <span><i class="seat-dot available"></i> Available</span>
          <span><i class="seat-dot selected"></i> Selected</span>
          <span><i class="seat-dot booked"></i> Booked</span>
        </div>
        <div class="screen-label">STAGE / SCREEN</div>
        <div id="seatMap" class="seat-map"></div>
      </div>

      <!-- Booking form -->
      <div class="booking-form-panel">
        <h3>Booking Details</h3>
        <form id="bookingForm" novalidate>
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" placeholder="Your full name">
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com">
          </div>
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="text" id="phone" placeholder="03XXXXXXXXX">
          </div>
          <div class="form-group">
            <label for="numTickets">Number of Tickets</label>
            <input type="number" id="numTickets" min="1" value="1" readonly>
            <small style="color:var(--color-text-secondary);">Auto-set based on seats selected</small>
          </div>

          <div class="price-breakdown">
            <div class="flex-between"><span>Subtotal</span><span id="pbSubtotal">Rs. 0</span></div>
            <div class="flex-between"><span>Discount</span><span id="pbDiscount">- Rs. 0</span></div>
            <div class="flex-between"><span>Tax (5%)</span><span id="pbTax">+ Rs. 0</span></div>
            <div class="ticket-divider"></div>
            <div class="flex-between total-row"><span>Total</span><span id="pbTotal">Rs. 0</span></div>
          </div>

          <button type="submit" class="btn btn-primary btn-block mt-md">Confirm Booking</button>
        </form>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container"><p>&copy; 2026 EventHub. All rights reserved.</p></div>
</footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/booking.js"></script>
</body>
</html>
