<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bookings — EventHub</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="index.html" class="brand">Event<span>Hub</span></a>
    <button class="nav-toggle" aria-label="Toggle menu">☰</button>
    <ul class="nav-links">
      <li><a href="index.html">Events</a></li>
      <li><a href="my-bookings.html" class="active">My Bookings</a></li>
      <li><a href="admin.html">Admin</a></li>
    </ul>
    <div class="nav-actions">
      <button class="theme-toggle" aria-label="Toggle dark mode">☾</button>
    </div>
  </div>
</nav>

<main class="section">
  <div class="container">
    <div class="section-head">
      <div>
        <h2>My Bookings</h2>
        <p>Enter the email you used while booking to view your tickets.</p>
      </div>
    </div>

    <form id="lookupForm" class="filter-bar" style="grid-template-columns: 1fr auto;">
      <div class="field">
        <label for="lookupEmail">Email address</label>
        <input type="email" id="lookupEmail" placeholder="you@example.com">
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button type="submit" class="btn btn-primary">Find My Bookings</button>
      </div>
    </form>

    <div id="bookingsList" class="bookings-list"></div>
    <div id="bookingsEmpty" class="empty-state" style="display:none;">
      <h3>No bookings found</h3>
      <p>Enter the email you used at checkout, or book your first event.</p>
      <a href="index.html" class="btn btn-primary mt-md">Browse Events</a>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container"><p>&copy; 2026 EventHub. All rights reserved.</p></div>
</footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/my-bookings.js"></script>
</body>
</html>
